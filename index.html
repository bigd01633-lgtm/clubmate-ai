const KEY='clubmate-v1';const defaults={club:'Newport Eagles AFC',players:[{id:1,name:'Alex Morgan',position:'GK',paid:5},{id:2,name:'Sam Davies',position:'DEF',paid:10},{id:3,name:'Jamie Lewis',position:'MID',paid:0},{id:4,name:'Chris Evans',position:'FWD',paid:5}],fixtures:[{id:1,opponent:'Riverside United',date:'2026-11-07',time:'14:30',venue:'Home',goalsFor:'',goalsAgainst:''}],availability:{},subsDue:10,sponsor:'Local Club Sponsor'};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)}let page='Dashboard';const pages=['Dashboard','Players','Fixtures','Availability','Payments','Match reports','Share','Settings'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const field=(label,id,value='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`;const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;const iconPaths=['<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>','<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6M18 15a5 5 0 0 1 3 5"/>','<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18M8 16h2M14 16h2"/>','<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>','<rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18M7 15h4"/>','<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5"/>','<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m9 10 6-4M9 14l6 4"/>','<path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M10 3h4l1 3 3 1 3 1v4l-3 2-1 3-1 4h-5l-1-3-3-1-3-1v-5l3-1 1-3z"/>'];

 class="stat-note">Players in your club</div></div><div class="panel"><span class="stat-symbol">▦</span><small>Upcoming fixtures</small><div class="metric">${upcoming.length}</div><div class="stat-note">Matches to prepare for</div></div><div class="panel"><span class="stat-symbol">£</span><small>Subs collected</small><div class="metric">£${collected.toFixed(2)}</div><div class="stat-note">Recorded payments</div></div><div class="panel"><span class="stat-symbol">◷</span><small>Still to collect</small><div class="metric">£${state.players.reduce((n,p)=>n+Math.max(0,state.subsDue-(Number(p.paid)||0)),0).toFixed(2)}</div><div class="stat-note">Outstanding player subs</div></div></div><div class="panel"><div class="section-heading"><h2>Coming up</h2>${btn('All fixtures ↗',"navigate('Fixtures')",'secondary')}</div>${fixtureTable(upcoming.slice(0,3))}</div><div class="panel"><div class="section-heading"><h2>Your next move</h2></div><div class="quick-actions">${btn('＋ Add a player',"navigate('Players')")}${btn('✓ Check availability',"navigate('Availability')")}${btn('£ Track subs',"navigate('Payments')")}${btn('↗ Write a report',"navigate('Match reports')")}</div></div>`}if(page==='Players'){v=`<div class="panel"><h2>Add a player</h2><form onsubmit="addPlayer(event)"><div class="grid">${field('Player name','playerName') }<label>Position<select id="position"><option>GK</option><option>DEF</option><option>MID</option><option>FWD</option></select></label></div><button>Add player</button></form></div><div class="panel"><h2>Squad</h2><table><tr><th>Name</th><th>Position</th><th></th></tr>${state.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${btn('Remove',`removePlayer(${p.id})`,'danger')}</td></tr>`).join('')}</table></div>`}if(page==='Fixtures'){v=`<div class="panel"><h2>Add a fixture</h2><form onsubmit="addFixture(event)"><div class="grid">${field('Opposition','opponent')}${field('Date','date','','date')}${field('Kick-off','time','14:30','time')}<la r===''&&f.goalsAgainst==='').sort((a,b)=>a.date.localeCompare(b.date))[0];v=`<div class="panel"><h2>Share team updates</h2><p class="notice">Generate messages for WhatsApp or your club group. Nothing is sent automatically.</p>${next?`<h3>Next match: ${esc(next.opponent)}</h3><p>${esc(next.date)} · ${esc(next.time)} · ${esc(next.venue)}</p><button onclick="shareFixture(${next.id})">Share next fixture</button> <button class="secondary" onclick="shareAvailability(${next.id})">Share availability summary</button>`:'<p>Add an upcoming fixture first.</p>'}<hr style="border-color:#31503e;margin:24px 0"><h3>Share club summary</h3><button onclick="shareClub()">Copy club summary</button></div>`}if(page==='Settings'){v=`<div class="panel"><h2>Club settings</h2>${field('Club name','clubName',state.club)}${field('Sponsor','sponsor',state.sponsor)}${btn('Save settings','saveSettings()')}<hr style="border-color:#31503e;margin:24px 0"><h2>Move your club online</h2><p class="notice">Export a backup below. Open the team workspace, sign in, create your club and import that backup in Settings. Your existing data stays here.</p><p><a href="https://clubmate-team-hub.viridstoat1.chatgpt.site/" style="color:#c4f56b">Open team workspace ↗</a></p><h2>Your data</h2><p class="notice">Everything is saved locally on this device. Clearing browser data will erase it. Export a backup regularly. This is not yet suitable for sensitive personal information.</p><div class="actions">${btn('Export backup','exportData()')}${btn('Import backup','document.getElementById(\'importFile\').click()','secondary')}${btn('Reset demo','resetDemo()','danger')}</div><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)"></div>`}document.getElementById('view').innerHTML=v;if(page==='Availability')renderAvailability()}
function navigate(p){page=p;render();window.scrollTo({top:0,behavior:'instant'})}function fixtureTable(fs){return fs.length?`<table class="fixture-table"><tr><th>Opponent</th><th>Date</th><th>Venue</th><th>Result</th><th></th></tr>${fs.map(f=>`<tr><td>${esc(f.opponent)}</td><td>${esc(f.date)} ${esc(f.time)}</td><td>${esc(f.venue)}</td><td><input style="width:52px" type="number" min="0" placeholder="-" value="${esc(f.goalsFor)}" onchange="score(${f.id},'goalsFor',this.value)"> : <input style="width:52px" type="number" min="0" placeholder="-" value="${esc(f.goalsAgainst)}" onchange="score(${f.id},'goalsAgainst',this.value)"></td><td>${btn('×',`removeFixture(${f.id})`,'danger')}</td></tr>`).join('')}</table>`:'<p class="muted">No fixtures yet.</p>'}function addPlayer(e){e.preventDefault();let name=document.getElementById('playerName').value.trim();if(!name)return;state.players.push({id:Date.now(),name,position:document.getElementById('position').value,paid:0});save();render()}function removePlayer(id){if(!confirm('Remove player?'))return;state.players=state.players.filter(p=>p.id!==id);save();render()}function addFixture(e){e.preventDefault();let opponent=document.getElementById('opponent').value.trim(),date=document.getElementById('date').value;if(!opponent||!date)return alert('Enter opposition and date');state.fixtures.push({id:Date.now(),opponent,date,time:document.getElementById('time').value,venue:document.getElementById('venue').value,goalsFor:'',goalsAgainst:''});save();render()}function removeFixture(id){if(!confirm('Remove fixture?'))return;state.fixtures=state.fixtures.filter(f=>f.id!==id);save();render()}function score(id,key,value){let f=state.fixtures.find(f=>f.id===id);if(f){f[key]=value;save()}}function renderAvailability(){let el=document.getElementById('avList'),sel=document.getElementById('avFixture');if(!sel||!el)return;let id=sel.value;el.innerHTML=state.players.map(p=>`<div class="row" style="padding:10px;border-bottom:1px solid #31503e"><span>${esc(p.name)}</span><select style="width:145px;margin:0" onchange="setAvailability('${id}',${p.id},this.value)"><option value="Unknown" ${(state.availability[id]?.[p.id]||'Unknown')==='Unknown'?'selected':''}>Not answered</option><option value="Available" ${state.availability[id]?.[p.id]==='Available'?'selected':''}>Available</option><option value="Unavailable" ${state.availability[id]?.[p.id]==='Unavailable'?'selected':''}>Unavailable</option></select></div>`).join('')||'<p>Add players first.</p>'}function setAvailability(id,pid,v){state.availability[id]??={};state.availability[id][pid]=v;save()}function updateDue(){let v=Number(document.getElementById('due').value);if(!Number.isFinite(v)||v<0)return;state.subsDue=v;save();render()}function setPaid(id,v){let p=state.players.find(p=>p.id===id);if(p){p.paid=Math.max(0,Number(v)||0);save();render()}}function generateReport(){let f=state.fixtures.find(f=>f.id==document.getElementById('reportFixture').value);if(!f)return;let h=document.getElementById('highlights').value.trim(),q=document.getElementById('quote').value.trim(),hasScore=f.goalsFor!==''&&f.goalsAgainst!=='';let result=hasScore?`${state.club} ${f.goalsFor}–${f.goalsAgainst} ${f.opponent}`:`${state.club} vs ${f.opponent}`;document.getElementById('reportOutput').value=`⚽ MATCH REPORT | ${result}\n\n${state.club} ${f.venue==='Home'?'welcomed':'travelled to face'} ${f.opponent} on ${f.date}. ${hasScore?`The match finished ${f.goalsFor}–${f.goalsAgainst}.`:''}\n\n${h||'[Add key moments, goalscorers and standout performances here.]'}\n\n${q?`Manager reaction: “${q}”\n\n`:''}Thanks to everyone who supported the team${state.sponsor?` and to our sponsor, ${state.sponsor}`:''}.\n\n#GrassrootsFootball #${state.club.replace(/[^a-zA-Z0-9]/g,'')}`;}async function copyReport(){let t=document.getElementById('reportOutput').value;if(!t)return;try{await navigator.clipboard.writeText(t);alert('Copied!')}catch{document.getElementById('reportOutput').select();alert('Select and copy the report.')}}function saveSettings(){state.club=document.getElementById('clubName').value.trim()||state.club;state.sponsor=document.getElementById('sponsor').value.trim();save();render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clubmate-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let file=e.target.files[0];if(!file)return;file.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.players)||!Array.isArray(d.fixtures)||typeof d.club!=='string')throw Error();state=d;save();render();alert('Backup imported')}catch{alert('Invalid backup file')}})}async function shareText(message){if(navigator.share){try{await navigator.share({text:message});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(message);alert('Message copied — paste it into WhatsApp or your group.')}catch{prompt('Copy this message:',message)}}function shareFixture(id){const f=state.fixtures.find(x=>x.id===id);if(!f)return;shareText(`⚽ ${state.club} vs ${f.opponent}\n📅 ${f.date} at ${f.time}\n📍 ${f.venue}\nPlease confirm your availability with the manager.`)}function shareAvailability(id){const f=state.fixtures.find(x=>x.id===id);if(!f)return;let names=state.players.map(p=>`${p.name}: ${state.availability[id]?.[p.id]||'Not answered'}`).join('\n');shareText(`⚽ Availability for ${state.club} vs ${f.opponent} (${f.date})\n\n${names}`)}function shareClub(){shareText(`⚽ ${state.club}\nPlayers: ${state.players.length}\nFixtures: ${state.fixtures.length}\nSubs outstanding: £${state.players.reduce((n,p)=>n+Math.max(0,state.subsDue-(Number(p.paid)||0)),0).toFixed(2)}`)}function resetDemo(){if(confirm('Reset all data to demo values?')){state=structuredClone(defaults);save();render()}}render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{})}</script></body></html>
