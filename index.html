<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClubMate AI — Grassroots Club Manager</title><meta name="theme-color" content="#10251b"><meta name="description" content="Manage grassroots football fixtures, players, availability and subs."><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#e9f4ee;background:#0b1712}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;background:#10251b;border-bottom:1px solid #28503b;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{margin:0;font-size:26px}h2{font-size:20px;margin:0 0 15px}small,.muted{color:#a6bdb0}main{max-width:1050px;margin:auto;padding:24px 15px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:16px}.tabs button{white-space:nowrap}.panel{background:#14271d;border:1px solid #2b4a38;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.metric{font-size:30px;font-weight:800;color:#79e3a3}button{cursor:pointer;border:0;background:#237a4d;color:white;border-radius:9px;padding:11px 14px;font-weight:700}button:hover{background:#2f9c63}button.secondary{background:#294637}button.danger{background:#7c3434}input,select,textarea{width:100%;background:#0d1d15;border:1px solid #3c654d;border-radius:9px;color:#fff;padding:11px;font:inherit;margin:5px 0 12px}label{display:block;color:#bed4c5;font-size:14px}textarea{min-height:100px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #31503e;padding:11px 7px}th{color:#9fc8ad;font-size:13px}.hidden{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{color:#bad7c2;font-size:13px}.pill{background:#284735;border-radius:20px;padding:4px 10px;font-size:12px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}footer{text-align:center;color:#91ab9a;padding:25px} @media(max-width:600px){td,th{font-size:12px;padding:8px 3px}button{padding:9px}}
</style></head><body><header><div><h1>⚽ ClubMate <span style="color:#72e2a2">AI</span></h1><small>Grassroots football, organised.</small></div><span class="pill">FREE PROTOTYPE</span></header><main><div class="tabs" id="tabs"></div><div id="view"></div></main><footer>ClubMate AI v0.2 · Data stays in this browser · No account required</footer><script>
const KEY='clubmate-v1';const defaults={club:'Newport Eagles AFC',players:[{id:1,name:'Alex Morgan',position:'GK',paid:5},{id:2,name:'Sam Davies',position:'DEF',paid:10},{id:3,name:'Jamie Lewis',position:'MID',paid:0},{id:4,name:'Chris Evans',position:'FWD',paid:5}],fixtures:[{id:1,opponent:'Riverside United',date:'2026-11-07',time:'14:30',venue:'Home',goalsFor:'',goalsAgainst:''}],availability:{},subsDue:10,sponsor:'Local Club Sponsor'};let state;try{state=JSON.parse(localStorage.getItem(KEY))||structuredClone(defaults)}catch{state=structuredClone(defaults)}let page='Dashboard';const pages=['Dashboard','Players','Fixtures','Availability','Payments','Match reports','Share','Settings'];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const field=(label,id,value='',type='text')=>`<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`;const btn=(text,action,cls='')=>`<button class="${cls}" onclick="${action}">${text}</button>`;function render(){document.getElementById('tabs').innerHTML=pages.map(p=>btn(p,`navigate('${p}')`,p===page?'':'secondary')).join('');let v='';if(page==='Dashboard'){let collected=state.players.reduce((n,p)=>n+(Number(p.paid)||0),0);v=`<div class="panel"><h2>Welcome to ${esc(state.club)}</h2><p class="muted">Manage your team, fixtures, availability and payments in one place.</p></div><div class="grid"><div class="panel"><small>Players</small><div class="metric">${state.players.length}</div></div><div class="panel"><small>Upcoming fixtures</small><div class="metric">${state.fixtures.filter(f=>!f.goalsFor&&!f.goalsAgainst).length}</div></div><div class="panel"><small>Subs collected</small><div class="metric">£${collected.toFixed(2)}</div></div><div class="panel"><small>Subs outstanding</small><div class="metric">£${state.players.reduce((n,p)=>n+Math.max(0,state.subsDue-(Number(p.paid)||0)),0).toFixed(2)}</div></div></div><div class="panel"><h2>Next fixtures</h2>${fixtureTable(state.fixtures.slice(0,3))}</div>`}if(page==='Players'){v=`<div class="panel"><h2>Add a player</h2><form onsubmit="addPlayer(event)"><div class="grid">${field('Player name','playerName') }<label>Position<select id="position"><option>GK</option><option>DEF</option><option>MID</option><option>FWD</option></select></label></div><button>Add player</button></form></div><div class="panel"><h2>Squad</h2><table><tr><th>Name</th><th>Position</th><th></th></tr>${state.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.position)}</td><td>${btn('Remove',`removePlayer(${p.id})`,'danger')}</td></tr>`).join('')}</table></div>`}if(page==='Fixtures'){v=`<div class="panel"><h2>Add a fixture</h2><form onsubmit="addFixture(event)"><div class="grid">${field('Opposition','opponent')}${field('Date','date','','date')}${field('Kick-off','time','14:30','time')}<label>Venue<select id="venue"><option>Home</option><option>Away</option></select></label></div><button>Add fixture</button></form></div><div class="panel"><h2>Fixtures and results</h2>${fixtureTable(state.fixtures)}</div>`}if(page==='Availability'){v=`<div class="panel"><h2>Player availability</h2><label>Choose fixture<select id="avFixture" onchange="renderAvailability()">${state.fixtures.map(f=>`<option value="${f.id}">${esc(f.opponent)} — ${esc(f.date)}</option>`).join('')}</select></label><div id="avList"></div></div>`}if(page==='Payments'){v=`<div class="panel"><h2>Player subs tracker</h2>${field('Amount due per player (£)','due',state.subsDue,'number')}${btn('Update amount','updateDue()')}<table><tr><th>Player</th><th>Paid (£)</th><th>Outstanding</th></tr>${state.players.map(p=>`<tr><td>${esc(p.name)}</td><td><input aria-label="Amount paid by ${esc(p.name)}" type="number" min="0" step="0.01" value="${p.paid}" onchange="setPaid(${p.id},this.value)"></td><td>£${Math.max(0,state.subsDue-(Number(p.paid)||0)).toFixed(2)}</td></tr>`).join('')}</table></div>`}if(page==='Match reports'){v=`<div class="panel"><h2>Match report generator</h2><p class="notice">Creates a ready-to-edit report from your match details. No external AI API or paid subscription required.</p><label>Fixture<select id="reportFixture">${state.fixtures.map(f=>`<option value="${f.id}">${esc(f.opponent)} — ${esc(f.date)}</option>`).join('')}</select></label><label>Highlights and scorers<textarea id="highlights" placeholder="e.g. Two goals from Jones, brilliant saves by our keeper..."></textarea></label><label>Manager quote (optional)<textarea id="quote" placeholder="e.g. Brilliant effort from everyone"></textarea></label>${btn('Generate match report','generateReport()')}<label>Editable report<textarea id="reportOutput" style="min-height:230px" placeholder="Your report appears here"></textarea></label>${btn('Copy report','copyReport()')}</div>`}if(page==='Share'){let next=state.fixtures.filter(f=>f.goalsFor===''&&f.goalsAgainst==='').sort((a,b)=>a.date.localeCompare(b.date))[0];v=`<div class="panel"><h2>Share team updates</h2><p class="notice">Generate messages for WhatsApp or your club group. Nothing is sent automatically.</p>${next?`<h3>Next match: ${esc(next.opponent)}</h3><p>${esc(next.date)} · ${esc(next.time)} · ${esc(next.venue)}</p><button onclick="shareFixture(${next.id})">Share next fixture</button> <button class="secondary" onclick="shareAvailability(${next.id})">Share availability summary</button>`:'<p>Add an upcoming fixture first.</p>'}<hr style="border-color:#31503e;margin:24px 0"><h3>Share club summary</h3><button onclick="shareClub()">Copy club summary</button></div>`}if(page==='Settings'){v=`<div class="panel"><h2>Club settings</h2>${field('Club name','clubName',state.club)}${field('Sponsor','sponsor',state.sponsor)}${btn('Save settings','saveSettings()')}<hr style="border-color:#31503e;margin:24px 0"><h2>Your data</h2><p class="notice">Everything is saved locally on this device. Clearing browser data will erase it. Export a backup regularly. This is not yet suitable for sensitive personal information.</p><div class="actions">${btn('Export backup','exportData()')}${btn('Import backup','document.getElementById(\'importFile\').click()','secondary')}${btn('Reset demo','resetDemo()','danger')}</div><input type="file" id="importFile" accept="application/json" class="hidden" onchange="importData(event)"></div>`}document.getElementById('view').innerHTML=v;if(page==='Availability')renderAvailability()}
function navigate(p){page=p;render()}function fixtureTable(fs){return fs.length?`<table><tr><th>Opponent</th><th>Date</th><th>Venue</th><th>Result</th><th></th></tr>${fs.map(f=>`<tr><td>${esc(f.opponent)}</td><td>${esc(f.date)} ${esc(f.time)}</td><td>${esc(f.venue)}</td><td><input style="width:52px" type="number" min="0" placeholder="-" value="${esc(f.goalsFor)}" onchange="score(${f.id},'goalsFor',this.value)"> : <input style="width:52px" type="number" min="0" placeholder="-" value="${esc(f.goalsAgainst)}" onchange="score(${f.id},'goalsAgainst',this.value)"></td><td>${btn('×',`removeFixture(${f.id})`,'danger')}</td></tr>`).join('')}</table>`:'<p class="muted">No fixtures yet.</p>'}function addPlayer(e){e.preventDefault();let name=document.getElementById('playerName').value.trim();if(!name)return;state.players.push({id:Date.now(),name,position:document.getElementById('position').value,paid:0});save();render()}function removePlayer(id){if(!confirm('Remove player?'))return;state.players=state.players.filter(p=>p.id!==id);save();render()}function addFixture(e){e.preventDefault();let opponent=document.getElementById('opponent').value.trim(),date=document.getElementById('date').value;if(!opponent||!date)return alert('Enter opposition and date');state.fixtures.push({id:Date.now(),opponent,date,time:document.getElementById('time').value,venue:document.getElementById('venue').value,goalsFor:'',goalsAgainst:''});save();render()}function removeFixture(id){if(!confirm('Remove fixture?'))return;state.fixtures=state.fixtures.filter(f=>f.id!==id);save();render()}function score(id,key,value){let f=state.fixtures.find(f=>f.id===id);if(f){f[key]=value;save()}}function renderAvailability(){let el=document.getElementById('avList'),sel=document.getElementById('avFixture');if(!sel||!el)return;let id=sel.value;el.innerHTML=state.players.map(p=>`<div class="row" style="padding:10px;border-bottom:1px solid #31503e"><span>${esc(p.name)}</span><select style="width:145px;margin:0" onchange="setAvailability('${id}',${p.id},this.value)"><option value="Unknown" ${(state.availability[id]?.[p.id]||'Unknown')==='Unknown'?'selected':''}>Not answered</option><option value="Available" ${state.availability[id]?.[p.id]==='Available'?'selected':''}>Available</option><option value="Unavailable" ${state.availability[id]?.[p.id]==='Unavailable'?'selected':''}>Unavailable</option></select></div>`).join('')||'<p>Add players first.</p>'}function setAvailability(id,pid,v){state.availability[id]??={};state.availability[id][pid]=v;save()}function updateDue(){let v=Number(document.getElementById('due').value);if(!Number.isFinite(v)||v<0)return;state.subsDue=v;save();render()}function setPaid(id,v){let p=state.players.find(p=>p.id===id);if(p){p.paid=Math.max(0,Number(v)||0);save();render()}}function generateReport(){let f=state.fixtures.find(f=>f.id==document.getElementById('reportFixture').value);if(!f)return;let h=document.getElementById('highlights').value.trim(),q=document.getElementById('quote').value.trim(),hasScore=f.goalsFor!==''&&f.goalsAgainst!=='';let result=hasScore?`${state.club} ${f.goalsFor}–${f.goalsAgainst} ${f.opponent}`:`${state.club} vs ${f.opponent}`;document.getElementById('reportOutput').value=`⚽ MATCH REPORT | ${result}\n\n${state.club} ${f.venue==='Home'?'welcomed':'travelled to face'} ${f.opponent} on ${f.date}. ${hasScore?`The match finished ${f.goalsFor}–${f.goalsAgainst}.`:''}\n\n${h||'[Add key moments, goalscorers and standout performances here.]'}\n\n${q?`Manager reaction: “${q}”\n\n`:''}Thanks to everyone who supported the team${state.sponsor?` and to our sponsor, ${state.sponsor}`:''}.\n\n#GrassrootsFootball #${state.club.replace(/[^a-zA-Z0-9]/g,'')}`;}async function copyReport(){let t=document.getElementById('reportOutput').value;if(!t)return;try{await navigator.clipboard.writeText(t);alert('Copied!')}catch{document.getElementById('reportOutput').select();alert('Select and copy the report.')}}function saveSettings(){state.club=document.getElementById('clubName').value.trim()||state.club;state.sponsor=document.getElementById('sponsor').value.trim();save();render()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clubmate-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){let file=e.target.files[0];if(!file)return;file.text().then(t=>{try{let d=JSON.parse(t);if(!Array.isArray(d.players)||!Array.isArray(d.fixtures)||typeof d.club!=='string')throw Error();state=d;save();render();alert('Backup imported')}catch{alert('Invalid backup file')}})}async function shareText(message){if(navigator.share){try{await navigator.share({text:message});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(message);alert('Message copied — paste it into WhatsApp or your group.')}catch{prompt('Copy this message:',message)}}function shareFixture(id){const f=state.fixtures.find(x=>x.id===id);if(!f)return;shareText(`⚽ ${state.club} vs ${f.opponent}\n📅 ${f.date} at ${f.time}\n📍 ${f.venue}\nPlease confirm your availability with the manager.`)}function shareAvailability(id){const f=state.fixtures.find(x=>x.id===id);if(!f)return;let names=state.players.map(p=>`${p.name}: ${state.availability[id]?.[p.id]||'Not answered'}`).join('\n');shareText(`⚽ Availability for ${state.club} vs ${f.opponent} (${f.date})\n\n${names}`)}function shareClub(){shareText(`⚽ ${state.club}\nPlayers: ${state.players.length}\nFixtures: ${state.fixtures.length}\nSubs outstanding: £${state.players.reduce((n,p)=>n+Math.max(0,state.subsDue-(Number(p.paid)||0)),0).toFixed(2)}`)}function resetDemo(){if(confirm('Reset all data to demo values?')){state=structuredClone(defaults);save();render()}}render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("./sw.js").catch(()=>{})}</script></body></html>
